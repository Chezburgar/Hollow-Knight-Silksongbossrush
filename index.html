<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hollow Knight: Silksong - Boss Rush</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="bossrush/style.css" />
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="boot-screen">
      <div class="boot-inner">
        <h1 class="boot-title">Silksong<span>Boss Rush</span></h1>
        <div id="boot-status">Starting</div>
        <div id="boot-bar"><div id="boot-bar-fill"></div></div>
        <div id="boot-detail"></div>
        <p class="boot-note">
          Assets stream in only as the game asks for them, and are kept for next time.
        </p>
      </div>
    </div>

    <div id="boot-error" hidden>
      <div class="boot-inner">
        <h2>Could not start</h2>
        <pre id="boot-error-text"></pre>
      </div>
    </div>

    <script type="module">
      import { boot } from "./bossrush/boot.js";
      import { mountLauncher } from "./bossrush/launcher.js";

      boot()
        .then((instance) => mountLauncher(instance))
        .catch((err) => {
          console.error(err);
          document.getElementById("boot-screen").classList.add("hidden");
          const box = document.getElementById("boot-error");
          box.hidden = false;
          document.getElementById("boot-error-text").textContent =
            (err && err.message) || String(err);
          window.__bootError = err;
        });
    </script>
  </body>
</html>
